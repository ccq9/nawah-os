        timeout-minutes: 15
        run: |
          retry() { t=$1; shift; for i in 1 2; do s=$SECONDS; timeout "$t" "$@" && return 0; rc=$?; echo "::warning title=Toolchain::attempt $i of 2 ended rc=$rc after $((SECONDS-s)) s of $t, $(ls /var/cache/apt/archives | grep -c 'deb$') packages fetched: $*"; sleep 10; done; return 1; }
          retry 100 sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=60 update -qq
          if ! retry 100 sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=60 install --download-only -y -qq python3-jsonschema python3-yaml; then
            echo "::warning title=Toolchain::the runner's mirror failed twice; fetching from archive.ubuntu.com"
            sudo sed -i 's#://[a-z0-9.-]*\.archive\.ubuntu\.com/#://archive.ubuntu.com/#g' /etc/apt/apt-mirrors.txt /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || true
            retry 300 sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=60 update -qq
            retry 300 sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=60 install --download-only -y -qq python3-jsonschema python3-yaml
          fi
          retry 300 sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=60 install -y -qq python3-jsonschema python3-yaml
          python3 -c "import jsonschema, yaml; print('jsonschema', jsonschema.__version__)"
      # This run's shard reports alone (no run-id, no token), all into the directory the merge reads.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          pattern: mutants-m6-shard-*
          path: build/mutants-m6-report.shards
          merge-multiple: true
      - name: "Mutation gate M6 (TST-M6-MUTANTS, M130 onwards): the merge of the twelve shards"
        # The cap mutants.yml gives the same command (there it runs the gate whole), above
        # TST-M6-MUTANTS's timeout_s (130 min); the shard count is set on this step alone (L-023).
        timeout-minutes: 135
        env:
          NAWAH_GATE_SHARDS: "12"
        run: python3 tools/project.py test --target host --suite M6-GATE
      - name: Report
        if: always()
        run: cat build/mutants-m6-report.json || true
      - name: This run's evidence directories (slot g, named by the checked-out commit's first 8 hex)
        # Not the older runs' committed directories of the slot (WP-153: evidence/*-<slot>/ took them all).
        id: rev
        if: always()
        run: echo "sha8=$(git rev-parse HEAD | cut -c1-8)" >> "$GITHUB_OUTPUT"
      # This job's own run directory (slot g), the gate's report and the shard reports it merged;
      # the merge job adopts them.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        continue-on-error: true
        with:
          name: evidence-g
          path: |
            evidence/*-${{ steps.rev.outputs.sha8 }}-*-g/
            build/mutants-m6-report.json
            build/mutants-m6-report.shards/
          retention-days: 7
  merge:
    # Adopts every test job's evidence, checks it strictly and publishes one ci-evidence/<run>
    # branch. Runs after a failed test job too (what exists is published, the run still fails;
    # import-ci-evidence refuses a run that did not succeed), never in a cancelled run.
    needs: [a, b, shard-1, shard-2, shard-3, shard-4, shard-5, shard-6, shard-7, shard-8, shard-9, shard-10, shard-11, shard-12, g]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write  # only for pushing evidence to ci-evidence/* branches (never main)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - name: Toolchain (Python modules of the validator)
        timeout-minutes: 15
        run: |
          retry() { t=$1; shift; for i in 1 2; do s=$SECONDS; timeout "$t" "$@" && return 0; rc=$?; echo "::warning title=Toolchain::attempt $i of 2 ended rc=$rc after $((SECONDS-s)) s of $t, $(ls /var/cache/apt/archives | grep -c 'deb$') packages fetched: $*"; sleep 10; done; return 1; }
          retry 100 sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=60 update -qq
          if ! retry 100 sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=60 install --download-only -y -qq python3-jsonschema python3-yaml; then
            echo "::warning title=Toolchain::the runner's mirror failed twice; fetching from archive.ubuntu.com"
            sudo sed -i 's#://[a-z0-9.-]*\.archive\.ubuntu\.com/#://archive.ubuntu.com/#g' /etc/apt/apt-mirrors.txt /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || true
            retry 300 sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=60 update -qq
            retry 300 sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=60 install --download-only -y -qq python3-jsonschema python3-yaml
          fi
          retry 300 sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=60 install -y -qq python3-jsonschema python3-yaml
          python3 -c "import jsonschema, yaml; print('jsonschema', jsonschema.__version__)"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          pattern: evidence-*
          path: incoming
      - name: Adopt this run's evidence (adopt-native, ADR-0026 rule 5)
        id: adopt
        run: |
          set -euo pipefail
          # Each artifact keeps the workspace layout: incoming/evidence-<slot>/evidence/<run>-<slot>/.
          # Every expected slot (the test jobs a and b, the merge-gate job g; the shard jobs have none) must have left a run directory:
          # a missing or empty artifact fails the merge job, nothing is adopted (security review M2).
          srcs=()
          for slot in a b g; do
            d="incoming/evidence-$slot/evidence"
            if ! ls "$d"/*/verdict.json >/dev/null 2>&1; then
              echo "::error title=Merge::evidence-$slot is missing or holds no run directory"; exit 1
            fi
            srcs+=(--from "$d")
          done
          python3 tools/project.py adopt-native "${srcs[@]}"
          mkdir -p build
          for slot in a b g; do
            if [ -d "incoming/evidence-$slot/build" ]; then cp -r "incoming/evidence-$slot/build/." build/; fi
          done
      - name: "validate-records --strict (after fresh evidence, nothing may be stale)"
        run: python3 tools/project.py validate-records --strict
      - name: "pre-merge gate (tools/pre-merge.sh: the same strict check through the script a records commit must pass)"
        run: tools/pre-merge.sh
      - name: Status
        run: python3 tools/project.py status --json
      - name: Publish evidence on a ci-evidence branch (readable where artifact download is blocked)
        # What was adopted is published even when the strict check failed; nothing after a
        # failed adoption or in a cancelled run.
        if: ${{ !cancelled() && steps.adopt.outcome == 'success' }}
        # Hardened (security review M1, correction 2): the system git, no global or system
        # config, no hooks, no traces, the token's header masked as soon as it exists. Code of
        # the repository still runs earlier in this job (adopt, strict); a publish job of its
        # own that runs none is WP-89.
        env:
          PUSH_TOKEN: ${{ github.token }}
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: 1
        run: |
          set -e
          # -f: a re-run's evidence replaces the earlier attempt's branch (run 40397458355).
          /usr/bin/git -c core.hooksPath=/dev/null checkout -q --orphan "ci-evidence/${GITHUB_RUN_ID}"
          /usr/bin/git -c core.hooksPath=/dev/null rm -rfq --cached . >/dev/null
          /usr/bin/git -c core.hooksPath=/dev/null add -f evidence/ build/pc-qemu/build-id.txt 2>/dev/null || /usr/bin/git -c core.hooksPath=/dev/null add -f evidence/
          /usr/bin/git -c core.hooksPath=/dev/null add -f build/hygiene.log 2>/dev/null || true
          /usr/bin/git -c core.hooksPath=/dev/null add -f build/mutants-m6-report.json 2>/dev/null || true
          /usr/bin/git -c core.hooksPath=/dev/null add -f build/mutants-m6-report.shards 2>/dev/null || true
          /usr/bin/git -c core.hooksPath=/dev/null -c user.name=nawah-ci -c user.email=ci@nawah-os.invalid commit -qm "CI evidence for ${GITHUB_SHA} (run ${GITHUB_RUN_ID})"
          auth=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          unset GIT_TRACE GIT_TRACE_CURL GIT_CURL_VERBOSE GIT_TRACE_REDACT GIT_TRACE_PACKET GIT_TRACE2 GIT_TRACE2_EVENT GIT_TRACE2_PERF
          /usr/bin/git -c core.hooksPath=/dev/null -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push -q -f origin "ci-evidence/${GITHUB_RUN_ID}"
      - name: A test job did not succeed
        if: ${{ !cancelled() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')) }}
        run: |
          echo "::error title=Merge::test jobs: ${{ join(needs.*.result, ', ') }}"
          exit 1
