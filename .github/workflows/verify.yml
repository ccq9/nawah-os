# Deterministic verification runner (OS-EXEC-AR 3.2 §1: verification_runner, no AI).
# Re-runs the same commands tools/project.py runs locally, on a fresh runner, and keeps the evidence as an artifact.
name: verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write  # only for pushing evidence to ci-evidence/* branches (never main)
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Durability sentinel (persistent-store test, §7.2)
        run: |
          echo "sentinel seen by fresh runner ${GITHUB_RUN_ID}:"; cat state/durability-sentinel.json
      - name: Toolchain (C for E0, Rust for the kernel, QEMU/OVMF lab)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld qemu-system-x86 qemu-system-arm ovmf qemu-efi-aarch64 mtools dosfstools python3-jsonschema python3-fonttools libharfbuzz-bin
          rustup toolchain install 1.97.0 --profile minimal -c rustfmt -c clippy
          rustup target add --toolchain 1.97.0 x86_64-unknown-uefi aarch64-unknown-uefi x86_64-unknown-none
          rustup run 1.97.0 rustc --version; cargo --version
          hb-shape --version | head -1; python3 -c "import fontTools; print('fonttools', fontTools.version)"
          clang --version | head -1; qemu-system-x86_64 --version | head -1; qemu-system-aarch64 --version | head -1; dpkg -s ovmf | grep ^Version; dpkg -s qemu-efi-aarch64 | grep ^Version
      - name: validate-records (committed state)
        run: python3 tools/project.py validate-records
      - name: Rust hygiene (fmt, clippy on both feature sets, unsafe policy)
        env:
          NAWAH_BUILD_ID: ci
        run: |
          set -o pipefail
          mkdir -p build
          {
            cargo fmt --all --check
            cargo clippy --manifest-path user/libnawah/Cargo.toml --target x86_64-unknown-none --offline -- -D warnings
            cargo clippy --manifest-path user/apps/hello/Cargo.toml --target x86_64-unknown-none --offline -- -D warnings
            cargo clippy --manifest-path user/apps/file_roundtrip/Cargo.toml --target x86_64-unknown-none --offline -- -D warnings
            cargo clippy --manifest-path user/apps/path_invalid/Cargo.toml --target x86_64-unknown-none --offline -- -D warnings
            cargo clippy --manifest-path user/apps/fd_leak/Cargo.toml --target x86_64-unknown-none --offline -- -D warnings
            cargo clippy --manifest-path user/apps/echo/Cargo.toml --target x86_64-unknown-none --offline -- -D warnings
            cargo clippy --manifest-path user/apps/launch/Cargo.toml --target x86_64-unknown-none --offline -- -D warnings
            cargo clippy --manifest-path user/apps/child/Cargo.toml --target x86_64-unknown-none --offline -- -D warnings
            cargo clippy --manifest-path user/apps/waiter/Cargo.toml --target x86_64-unknown-none --offline -- -D warnings
            cargo clippy --manifest-path user/apps/svcmgr/Cargo.toml --target x86_64-unknown-none --offline -- -D warnings
            cargo clippy --manifest-path user/apps/svc/Cargo.toml --target x86_64-unknown-none --offline -- -D warnings
            cargo clippy --manifest-path user/nawah-crypto/Cargo.toml --target x86_64-unknown-none --offline -- -D warnings
            cargo clippy --manifest-path user/apps/authd/Cargo.toml --target x86_64-unknown-none --offline -- -D warnings
            cargo clippy --manifest-path user/apps/configd/Cargo.toml --target x86_64-unknown-none --offline -- -D warnings
            cargo clippy --manifest-path user/apps/netprobe/Cargo.toml --target x86_64-unknown-none --offline -- -D warnings
            cargo clippy --manifest-path user/apps/kbdprobe/Cargo.toml --target x86_64-unknown-none --offline -- -D warnings
            cargo clippy --manifest-path user/apps/netd/Cargo.toml --target x86_64-unknown-none --offline -- -D warnings
            cargo clippy --manifest-path user/apps/sh/Cargo.toml --target x86_64-unknown-none --offline -- -D warnings
            cargo clippy --manifest-path user/apps/fbprobe/Cargo.toml --target x86_64-unknown-none --offline -- -D warnings
            cargo clippy --manifest-path user/apps/inputd/Cargo.toml --target x86_64-unknown-none --offline -- -D warnings
            cargo clippy --manifest-path user/apps/displayd/Cargo.toml --target x86_64-unknown-none --offline -- -D warnings
            cargo clippy --manifest-path user/apps/winapp/Cargo.toml --target x86_64-unknown-none --offline -- -D warnings
            cargo clippy --manifest-path user/libnawah-text/Cargo.toml --target x86_64-unknown-none --offline -- -D warnings
            cargo clippy --manifest-path user/apps/textprobe/Cargo.toml --target x86_64-unknown-none --offline -- -D warnings
            cargo clippy --manifest-path user/libui/Cargo.toml --target x86_64-unknown-none --offline -- -D warnings
            cargo clippy --manifest-path user/apps/narrator/Cargo.toml --target x86_64-unknown-none --offline -- -D warnings
            cargo clippy --manifest-path user/apps/dialog/Cargo.toml --target x86_64-unknown-none --offline -- -D warnings
            cargo clippy --manifest-path kernel/Cargo.toml --target x86_64-unknown-uefi --offline -- -D warnings
            cargo clippy --manifest-path kernel/Cargo.toml --target x86_64-unknown-uefi --offline --features inject_ebs_fail -- -D warnings
            cargo clippy --manifest-path kernel/Cargo.toml --target x86_64-unknown-uefi --offline --profile ktest --features ktest -- -D warnings
            cargo clippy --manifest-path kernel/Cargo.toml --target aarch64-unknown-uefi --offline -- -D warnings
            sh tools/check-unsafe.sh
          } 2>&1 | tee build/hygiene.log
      - name: E0 (C toolchain experiment, M0 evidence)
        run: |
          python3 tools/project.py build --target pc-qemu-e0
          python3 tools/project.py boot --target pc-qemu-e0
      - name: M1 build + guest suite (Rust kernel)
        run: |
          python3 tools/project.py build --target pc-qemu
          python3 tools/project.py test --target pc-qemu --suite M1
      - name: M2 guest suite (test kernel, exceptions)
        run: python3 tools/project.py test --target pc-qemu --suite M2
      - name: M3 guest suite (test kernel)
        run: python3 tools/project.py test --target pc-qemu --suite M3
      - name: M4 guest suite (test kernel, processes from the volume)
        run: python3 tools/project.py test --target pc-qemu --suite M4
      - name: M5 guest suite (test kernel, display and input)
        run: python3 tools/project.py test --target pc-qemu --suite M5
      - name: A64 early port experiment (build + boot on QEMU virt, ADR-0008)
        run: |
          python3 tools/project.py build --target virt-qemu-aarch64
          python3 tools/project.py boot --target virt-qemu-aarch64
      - name: Host suites
        run: |
          python3 tools/project.py test --target host --suite M0
          python3 tools/project.py test --target host --suite M1
          python3 tools/project.py test --target host --suite M3
          python3 tools/project.py test --target host --suite M4
          python3 tools/project.py test --target host --suite M5
      - name: "validate-records --strict (after fresh evidence, nothing may be stale)"
        run: python3 tools/project.py validate-records --strict
      - name: Status
        run: python3 tools/project.py status --json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-${{ github.sha }}
          path: evidence/
          retention-days: 90
      - name: Publish evidence on a ci-evidence branch (readable where artifact download is blocked)
        if: always()
        run: |
          set -e
          git config user.name "nawah-ci"
          git config user.email "ci@nawah-os.invalid"
          git checkout --orphan "ci-evidence/${GITHUB_RUN_ID}"
          git rm -rfq --cached . >/dev/null
          git add -f evidence/ build/pc-qemu/build-id.txt 2>/dev/null || git add -f evidence/
          git add -f build/hygiene.log 2>/dev/null || true
          git commit -qm "CI evidence for ${GITHUB_SHA} (run ${GITHUB_RUN_ID})"
          git push -q origin "ci-evidence/${GITHUB_RUN_ID}"
