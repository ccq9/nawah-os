# nawah-os workspace. Profiles live here (cargo ignores profiles in member manifests).
[workspace]
members = ["kernel", "user/libnawah", "user/apps/hello", "user/apps/file_roundtrip", "user/apps/path_invalid", "user/apps/fd_leak", "user/apps/echo", "user/apps/launch", "user/apps/child", "user/apps/waiter", "user/apps/svcmgr", "user/apps/svc", "user/nawah-crypto", "user/apps/authd", "user/apps/configd", "user/apps/netprobe", "user/apps/kbdprobe", "user/apps/netd"]
resolver = "2"

[profile.dev]
panic = "abort"
opt-level = 1

[profile.release]
panic = "abort"
opt-level = 2
lto = true
codegen-units = 1
debug = 1

# Test kernel: release optimisation plus runtime checks (overflow, debug assertions) so that
# bugs invisible in the normal kernel surface in the test kernel (Sol OS ADR-010 §13).
[profile.ktest]
inherits = "release"
debug-assertions = true
overflow-checks = true

# Applications (WP-17): release settings without LTO — the precompiled `core` for
# x86_64-unknown-none carries the target's default "kernel" code model and LTO refuses to merge
# its bitcode with the applications' "large" model (CI run 39107164955); plain linking is fine.
[profile.app]
inherits = "release"
lto = false
debug = 0
